mapbiomas:
  collection: 10
  # Read as a window straight from the national GeoTIFF (no full download).
  # Check the URL against the MapBiomas collection page if it stops resolving.
  url_template: "https://storage.googleapis.com/mapbiomas-public/initiatives/brasil/collection_10/lulc/coverage/brazil_coverage_{year}.tif"

years:
  start: 1985        # start of training period
  train_end: 2015    # end of training period / start of validation
  validation_end: 2023
  horizon: 2040

# Simplified legend. MapBiomas codes -> model classes (ids are used in the rasters).
classes:
  1: {name: natural,  label: "Natural vegetation", mapbiomas: [1, 3, 4, 5, 6, 10, 11, 12, 13, 29, 32, 49, 50]}
  2: {name: agro,     label: "Agriculture and pasture", mapbiomas: [9, 14, 15, 18, 19, 20, 21, 35, 36, 39, 40, 41, 46, 47, 48, 62]}
  3: {name: urban,    label: "Urban area", mapbiomas: [24]}
  4: {name: water,    label: "Water", mapbiomas: [26, 31, 33, 34]}
  5: {name: other,    label: "Other", mapbiomas: [22, 23, 25, 30]}
  # Anything else (including 0 / 27, not observed) becomes 0 = no data.

ca:
  neighborhood_radius: 2     # cells (Moore window of size 2r+1 = 5x5 ≈ 150 m)
  noise: 0.3                 # stochastic perturbation of cell potential (0 = deterministic)
  seed: 42

suitability:
  bins: 12                   # quantile bins per factor
  roads_filter: '["highway"~"motorway|trunk|primary|secondary"]'
